<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" role="img" aria-label="Binus Arcade">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D1117"/>
      <stop offset="0.55" stop-color="#111827"/>
      <stop offset="1" stop-color="#161B22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#371f69"/>
      <stop offset="1" stop-color="#8B74E8"/>
    </linearGradient>
    <linearGradient id="cardGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8B74E8" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#371f69" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- 1200x1200, safe content inset ~80px -->
  <rect width="1200" height="1200" fill="url(#bg)"/>
  <circle cx="1040" cy="120" r="320" fill="#8B74E8" opacity="0.10"/>
  <circle cx="140" cy="1080" r="300" fill="#371f69" opacity="0.22"/>
  <rect x="0" y="1152" width="1200" height="48" fill="#8B74E8" opacity="0.18"/>

  <!-- Brand -->
  <g transform="translate(120,120)">
    <g>
      <rect width="96" height="96" rx="24" fill="url(#accent)"/>
      <rect x="22" y="25" width="52" height="34" rx="9" fill="#0D1117" opacity="0.95"/>
      <path d="M48 34c-9 0-16 7-16 16 0 6 3 10 8 13v3c0 2 2 4 4 4h8c2 0 4-2 4-4v-3c5-3 8-7 8-13 0-9-7-16-16-16Z" fill="#FFFFFF" opacity=".95"/>
      <path d="M41 50h14M48 43v14" stroke="#371f69" stroke-width="4.5" stroke-linecap="round"/>
      <circle cx="32" cy="75" r="4.5" fill="#FF7BB8"/>
      <circle cx="64" cy="75" r="4.5" fill="#2FE0A8"/>
    </g>
    <text x="124" y="66" fill="#E6EDF3" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="38" font-weight="600">RomM library, mobile-first</text>
  </g>

  <!-- Headline -->
  <g transform="translate(120,300)">
    <text x="0" y="0" fill="#FFFFFF" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="104" font-weight="800">Binus Arcade</text>
    <text x="0" y="78" fill="#C9D1D9" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="46" font-weight="500">Your RomM library, on your phone</text>
  </g>

  <!-- Phone/library card -->
  <g transform="translate(340,470)">
    <rect x="16" y="22" width="520" height="460" rx="52" fill="#000000" opacity="0.22"/>
    <rect width="520" height="460" rx="52" fill="#161B22" stroke="#30363D" stroke-width="4"/>
    <rect width="520" height="460" rx="52" fill="url(#cardGlow)"/>
    <rect x="40" y="40" width="440" height="270" rx="30" fill="#0D1117" stroke="#21262D" stroke-width="3"/>
    <rect x="76" y="80" width="368" height="24" rx="12" fill="#21262D"/>
    <rect x="76" y="118" width="276" height="18" rx="9" fill="#30363D"/>
    <g transform="translate(260,178)">
      <circle r="54" fill="url(#accent)"/>
      <path d="M-21 0h42M0 -21v42" stroke="#FFFFFF" stroke-width="11" stroke-linecap="round"/>
    </g>
    <rect x="76" y="266" width="368" height="12" rx="6" fill="#2FE0A8" opacity="0.9"/>
    <g font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="600">
      <rect x="40" y="342" width="132" height="64" rx="18" fill="#21262D"/>
      <rect x="184" y="342" width="132" height="64" rx="18" fill="#21262D"/>
      <rect x="328" y="342" width="152" height="64" rx="18" fill="#21262D"/>
      <circle cx="104" cy="374" r="9" fill="#FF7BB8"/>
      <circle cx="248" cy="374" r="9" fill="#FFCE00"/>
      <circle cx="404" cy="374" r="9" fill="#2FE0A8"/>
      <text x="124" y="382" fill="#E6EDF3" font-size="20">ROM</text>
      <text x="268" y="382" fill="#E6EDF3" font-size="20">PWA</text>
      <text x="424" y="382" fill="#E6EDF3" font-size="20">Library</text>
    </g>
  </g>

  <!-- Badges -->
  <g transform="translate(120,1015)" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="30" font-weight="700">
    <rect width="170" height="56" rx="28" fill="#21262D" stroke="#30363D"/>
    <text x="85" y="37" text-anchor="middle" fill="#E6EDF3">View-only</text>
    <rect x="188" width="104" height="56" rx="28" fill="#21262D" stroke="#30363D"/>
    <text x="240" y="37" text-anchor="middle" fill="#E6EDF3">PWA</text>
    <rect x="310" width="194" height="56" rx="28" fill="#21262D" stroke="#30363D"/>
    <text x="407" y="37" text-anchor="middle" fill="#E6EDF3">Self-hosted</text>
  </g>
</svg>
