<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Binus Arcade">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D1117"/>
      <stop offset="0.55" stop-color="#111827"/>
      <stop offset="1" stop-color="#161B22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#371f69"/>
      <stop offset="1" stop-color="#8B74E8"/>
    </linearGradient>
    <linearGradient id="cardGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8B74E8" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#371f69" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- 1200x630, safe content inset ~80px -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1060" cy="70" r="280" fill="#8B74E8" opacity="0.10"/>
  <circle cx="160" cy="570" r="240" fill="#371f69" opacity="0.22"/>
  <rect x="0" y="598" width="1200" height="32" fill="#8B74E8" opacity="0.18"/>

  <!-- Library/device card -->
  <g transform="translate(90,120)">
    <rect x="12" y="18" width="420" height="360" rx="44" fill="#000000" opacity="0.22"/>
    <rect width="420" height="360" rx="44" fill="#161B22" stroke="#30363D" stroke-width="4"/>
    <rect width="420" height="360" rx="44" fill="url(#cardGlow)"/>
    <rect x="34" y="34" width="352" height="214" rx="26" fill="#0D1117" stroke="#21262D" stroke-width="3"/>
    <rect x="62" y="66" width="296" height="20" rx="10" fill="#21262D"/>
    <rect x="62" y="98" width="220" height="16" rx="8" fill="#30363D"/>
    <g transform="translate(210,141)">
      <circle r="46" fill="url(#accent)"/>
      <path d="M-18 0h36M0 -18v36" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round"/>
    </g>
    <rect x="62" y="214" width="296" height="10" rx="5" fill="#2FE0A8" opacity="0.9"/>
    <g fill="#C9D1D9" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="600">
      <rect x="34" y="272" width="104" height="54" rx="16" fill="#21262D"/>
      <rect x="150" y="272" width="104" height="54" rx="16" fill="#21262D"/>
      <rect x="266" y="272" width="120" height="54" rx="16" fill="#21262D"/>
      <circle cx="86" cy="299" r="8" fill="#FF7BB8"/>
      <circle cx="202" cy="299" r="8" fill="#FFCE00"/>
      <circle cx="326" cy="299" r="8" fill="#2FE0A8"/>
      <text x="104" y="306" fill="#E6EDF3" font-size="18">ROM</text>
      <text x="220" y="306" fill="#E6EDF3" font-size="18">PWA</text>
      <text x="344" y="306" fill="#E6EDF3" font-size="18">Library</text>
    </g>
  </g>

  <!-- Brand + copy -->
  <g transform="translate(580,150)">
    <g transform="translate(0,0)">
      <rect width="84" height="84" rx="22" fill="url(#accent)"/>
      <rect x="19" y="22" width="46" height="30" rx="8" fill="#0D1117" opacity="0.95"/>
      <path d="M42 30c-8 0-14 6-14 14 0 5 3 9 7 11v3c0 2 2 4 4 4h6c2 0 4-2 4-4v-3c4-2 7-6 7-11 0-8-6-14-14-14Z" fill="#FFFFFF" opacity=".95"/>
      <path d="M36 44h12M42 38v12" stroke="#371f69" stroke-width="4" stroke-linecap="round"/>
      <circle cx="28" cy="66" r="4" fill="#FF7BB8"/>
      <circle cx="56" cy="66" r="4" fill="#2FE0A8"/>
    </g>

    <text x="108" y="58" fill="#E6EDF3" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="600">RomM library, mobile-first</text>

    <text x="0" y="190" fill="#FFFFFF" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="92" font-weight="800">Binus Arcade</text>
    <text x="0" y="258" fill="#C9D1D9" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="42" font-weight="500">Your RomM library, on your phone</text>

    <g transform="translate(0,305)" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="700">
      <rect width="150" height="50" rx="25" fill="#21262D" stroke="#30363D"/>
      <text x="75" y="33" text-anchor="middle" fill="#E6EDF3">View-only</text>
      <rect x="166" width="92" height="50" rx="25" fill="#21262D" stroke="#30363D"/>
      <text x="212" y="33" text-anchor="middle" fill="#E6EDF3">PWA</text>
      <rect x="274" width="170" height="50" rx="25" fill="#21262D" stroke="#30363D"/>
      <text x="359" y="33" text-anchor="middle" fill="#E6EDF3">Self-hosted</text>
    </g>
  </g>
</svg>
