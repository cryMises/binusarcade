name = "binusarcade-signup-relay"
main = "src/index.js"
compatibility_date = "2026-11-01"

# KV namespace for public app settings (trial game, registration toggle).
# Create/bind with:
#   wrangler kv namespace create SETTINGS
#   wrangler kv namespace create SETTINGS --preview
# Then replace the id/preview_id values below with the ones Wrangler prints.
#
# Trial proxy secret (RomM Client API Token, read-only scopes, never in repo/chat/browser):
#   wrangler secret put TRIAL_API_TOKEN
# Deploy after KV binding + secret are set:
#   wrangler deploy
[[kv_namespaces]]
binding = "SETTINGS"
id = "REPLACE_WITH_SETTINGS_KV_ID"
preview_id = "REPLACE_WITH_SETTINGS_PREVIEW_KV_ID"

[vars]
ROMM_ORIGIN = "https://crymises-music.centralindia.cloudapp.azure.com:8449"
APP_PUBLIC_URL = "https://crymises.github.io/binusarcade"
ALLOWED_ORIGINS = "https://crymises.github.io,https://binusarcade.pages.dev,http://localhost:8080,http://127.0.0.1:8080"
MAX_DAILY_MINTS = "500"

[[durable_objects.bindings]]
name = "RELAY"
class_name = "SignupRelayDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SignupRelayDO"]
