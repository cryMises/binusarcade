<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0908" />
    <title>Binus Arcade · emulator</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #0b0908;
      }
      #game {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }
      #game canvas {
        display: block;
      }
      .frame-message {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        max-width: 34rem;
        margin: 0 auto;
        padding: 20px;
        color: #f6e9d8;
        font-family: system-ui, sans-serif;
        font-size: 14px;
        line-height: 1.6;
        text-align: center;
      }
      ruffle-player {
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="game" aria-label="Game emulator"></div>
    <script type="module" src="./play-frame.js"></script>
  </body>
</html>
